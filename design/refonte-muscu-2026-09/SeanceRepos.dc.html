<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    :root{
      --bg:#f7eede; --surface:#fffaf2; --surfaceAlt:#f3ddd0; --border:#ece0cd;
      --borderStrong:#90897d; --text:#33291f; --muted:#786a59; --accent:#b14f2b;
      --accentText:#ffffff; --success:#66714b; --danger:#b23b2e; --track:#eadcc6;
      --chartGreen:#7c8a5b; --amber:#b47f31; --warn:#f7ead6; --warnBorder:#e9cfa0;
      --warnText:#8a6419; --panel:#33291f; --panelText:#f0e4d0; --panelMuted:#c9b79a;
      --panelAccent:#d9a888;
      --display:'Bricolage Grotesque', Georgia, serif;
      --body:'Hanken Grotesk', system-ui, sans-serif;
      --mono:'Space Mono', ui-monospace, monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--body);color:var(--text);-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none} a:hover{color:#8f3f22}
    .scr{width:390px;background:var(--bg);position:relative;overflow:hidden}
    .pad{padding:0 20px}
    .eyebrow{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.08em;
      text-transform:uppercase;color:var(--muted)}
    .h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.8px;line-height:1.1}
    .h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.3px}
    .h3{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:-.3px}
    .body{font-size:14px;line-height:20px}
    .small{font-size:13px;line-height:18px}
    .tiny{font-size:12px;line-height:16px}
    .mono{font-family:var(--mono)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:18px}
    .tile{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:16px;
      display:flex;flex-direction:column}
    .chip{border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;
      background:var(--surfaceAlt);color:var(--muted)}
    .chip.on{background:var(--accent);color:#fff}
    .btn{min-height:52px;border-radius:16px;background:var(--accent);color:#fff;
      font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    .row{display:flex;align-items:center}
    .fold{position:absolute;left:0;right:0;border-top:2px dashed var(--danger);
      display:flex;justify-content:flex-end;pointer-events:none}
    .foldtag{background:var(--danger);color:#fff;font-size:10px;font-weight:700;
      padding:2px 8px;border-radius:0 0 6px 6px;letter-spacing:.04em}
    .flag{position:absolute;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
      padding:3px 8px;border-radius:8px;letter-spacing:.02em;line-height:1.3}
    .flag.ok{background:var(--success)}
  </style>
</helmet>
<div class="scr" style="height:844px;background:var(--panel)">

  <div class="row" style="justify-content:space-between;padding:14px 20px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#c9b79a" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    <span class="tiny" style="color:var(--panelMuted);font-weight:600">RÉDUIRE</span>
    <div style="width:26px"></div>
  </div>

  <div style="padding:64px 24px 0;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div class="eyebrow" style="color:var(--panelMuted)">Repos</div>
    <div class="mono" style="font-size:78px;font-weight:700;color:var(--panelText);line-height:1;letter-spacing:-2px">1:12</div>

    <!-- Ce qui vient après : le repos n’est plus un temps mort aveugle -->
    <div style="margin-top:26px;background:rgba(217,168,136,.12);border-radius:18px;padding:16px 18px;width:100%;display:flex;flex-direction:column;gap:9px">
      <div class="eyebrow" style="color:var(--panelAccent)">Ensuite</div>
      <div class="row" style="justify-content:space-between;gap:12px">
        <span class="small" style="color:var(--panelText);font-weight:600;flex-grow:1">Développé couché barre · série 3</span>
        <span class="mono" style="font-size:14px;font-weight:700;color:var(--panelAccent)">82,5 × 8</span>
      </div>
    </div>
  </div>

  <div style="padding:34px 24px 0;display:flex;flex-direction:column;gap:12px">
    <div class="row" style="gap:12px">
      <div style="flex-grow:1;min-height:52px;border-radius:16px;border:1px solid rgba(240,228,208,.32);display:flex;align-items:center;justify-content:center">
        <span style="font-size:15px;font-weight:700;color:var(--panelText)">− 15 s</span>
      </div>
      <div style="flex-grow:1;min-height:52px;border-radius:16px;border:1px solid rgba(240,228,208,.32);display:flex;align-items:center;justify-content:center">
        <span style="font-size:15px;font-weight:700;color:var(--panelText)">+ 15 s</span>
      </div>
    </div>
    <div class="btn" style="background:var(--panelAccent);color:var(--panel)">Passer le repos</div>
  </div>

  <!-- Le réglage migre ici : là où on constate que 90 s ne suffisent pas -->
  <div style="position:absolute;left:24px;right:24px;bottom:28px">
    <div class="row" style="gap:11px;border:1px dashed rgba(240,228,208,.3);border-radius:15px;padding:13px 15px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c9b79a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg>
      <span class="tiny" style="flex-grow:1;color:var(--panelMuted)">Toujours <span style="color:var(--panelText);font-weight:700">2:00</span> de repos sur cet exercice</span>
      <div style="width:38px;height:22px;border-radius:11px;background:rgba(240,228,208,.22);padding:2px">
        <div style="width:18px;height:18px;border-radius:9px;background:var(--panelMuted)"></div>
      </div>
    </div>
  </div>


</div>
</x-dc>
</body>
</html>
