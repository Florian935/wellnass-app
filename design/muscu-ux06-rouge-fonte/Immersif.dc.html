<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance immersive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{p.bg}}; color: {{p.text}}; font-family: 'Hanken Grotesk', sans-serif; display: flex; flex-direction: column;">
  <div style="padding: 44px 12px 0; display: flex; align-items: center;">
    <button aria-label="Quitter la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{p.text}}" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
    <span style="flex-grow: 1; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700;">31:08</span>
    <button aria-label="Menu de la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="{{p.text}}"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
    </button>
  </div>
  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 4px;">
      <sc-for list="{{segments}}" as="seg" hint-placeholder-count="5">
        <div style="flex-grow: {{seg.grow}}; height: 6px; border-radius: 3px; background: {{p.track}}; overflow: hidden;">
          <div style="width: {{seg.width}}; height: 6px; background: {{seg.fill}};"></div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; color: {{p.muted}};">7/18 séries</span>
      <span style="padding: 4px 10px; border-radius: 10px; background: {{p.alt}}; color: {{p.success}}; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;">+2,5 kg sur mardi</span>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1.2px; color: {{p.muted}};">EXERCICE 2 SUR 5</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 42px; letter-spacing: -1.5px; line-height: 46px;">Squat</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <span style="height: 30px; padding: 0 10px; border-radius: 15px; display: flex; align-items: center; gap: 4px; background: {{successTint}}; color: {{p.success}}; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{p.success}}" stroke-width="3" stroke-linecap="round"><path d="m5 12 5 5 9-10"></path></svg>8×100</span>
      <span style="height: 30px; padding: 0 10px; border-radius: 15px; display: flex; align-items: center; gap: 4px; background: {{successTint}}; color: {{p.success}}; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{p.success}}" stroke-width="3" stroke-linecap="round"><path d="m5 12 5 5 9-10"></path></svg>8×100</span>
      <span style="height: 30px; box-sizing: border-box; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; border: 1.5px solid {{p.accent}}; color: {{p.accent}}; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;">Série 3/4</span>
      <span style="width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{p.alt}}; color: {{p.muted}}; font-family: 'Space Mono', monospace; font-size: 12px;">4</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 12px; align-items: baseline;">
        <span style="width: 96px; font-size: 13px; color: {{p.muted}};">Dernière fois</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700;">8 × 100 kg</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: baseline;">
        <span style="width: 96px; font-size: 13px; color: {{p.muted}};">Prévu</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700;">8 × 102,5 kg</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: {{p.success}};">+2,5</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: baseline;">
        <span style="width: 96px; font-size: 13px; color: {{p.muted}};">Consigne</span>
        <span style="font-size: 14px; font-weight: 600;">Descends sous la parallèle</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px;">
      <div style="display: flex; align-items: center; justify-content: center; height: 110px;">
        <div style="width: 22px; height: 12px; border-radius: 3px; background: {{bar}};"></div>
        <sc-for list="{{left}}" as="plate" hint-placeholder-count="3">
          <div style="width: {{plate.w}}; height: {{plate.h}}; margin: 0 1px; border-radius: 4px; background: {{plate.c}};"></div>
        </sc-for>
        <div style="width: 8px; height: 22px; border-radius: 2px; background: {{bar}};"></div>
        <div style="width: 120px; height: 7px; background: {{bar}};"></div>
        <div style="width: 8px; height: 22px; border-radius: 2px; background: {{bar}};"></div>
        <sc-for list="{{right}}" as="plate" hint-placeholder-count="3">
          <div style="width: {{plate.w}}; height: {{plate.h}}; margin: 0 1px; border-radius: 4px; background: {{plate.c}};"></div>
        </sc-for>
        <div style="width: 22px; height: 12px; border-radius: 3px; background: {{bar}};"></div>
      </div>
      <span style="font-family: 'Space Mono', monospace; font-size: 12.5px; color: {{p.muted}};">25 + 15 + 1,25 de chaque côté · barre 20 kg</span>
      <div style="display: flex; gap: 8px; align-items: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{p.accent}}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
        <span style="font-size: 14.5px; font-weight: 600;">Ajoute 1,25 kg de chaque côté</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 26px; background: {{p.surface}}; border-top: 1px solid {{p.border}}; border-top-left-radius: 26px; border-top-right-radius: 26px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: {{p.muted}};">Reps</span>
        <div style="height: 54px; border-radius: 16px; background: {{p.alt}}; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
          <button aria-label="Une rep de moins" style="width: 44px; height: 44px; border: none; background: transparent; color: {{p.text}}; font-size: 22px; font-family: 'Hanken Grotesk', sans-serif;">−</button>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800;">8</span>
          <button aria-label="Une rep de plus" style="width: 44px; height: 44px; border: none; background: transparent; color: {{p.text}}; font-size: 22px; font-family: 'Hanken Grotesk', sans-serif;">+</button>
        </div>
      </div>
      <div style="flex-grow: 1.3; flex-basis: 0; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: {{p.muted}};">Charge</span>
        <div style="height: 54px; border-radius: 16px; background: {{p.alt}}; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
          <button aria-label="Retirer 2,5 kg" style="width: 44px; height: 44px; border: none; background: transparent; color: {{p.text}}; font-size: 22px; font-family: 'Hanken Grotesk', sans-serif;">−</button>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800;">102,5</span>
          <button aria-label="Ajouter 2,5 kg" style="width: 44px; height: 44px; border: none; background: transparent; color: {{p.text}}; font-size: 22px; font-family: 'Hanken Grotesk', sans-serif;">+</button>
        </div>
      </div>
    </div>
    <button style="height: 60px; border: none; border-radius: 18px; background: {{p.accent}}; color: {{p.onAccent}}; font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 19px;">Série faite</button>
    <span style="text-align: center; font-size: 13px; color: {{p.muted}};">Ensuite · Squat · série 4</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"p":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p ?? {
      bg: '#221210', surface: '#3c211f', alt: '#472824', border: '#472824', track: '#472824',
      text: '#f4ecdd', muted: '#c9b79a', accent: '#e07a98', onAccent: '#1c150e', success: '#a9ba7e',
    };
    const plates = [
      { w: '13px', h: '104px', c: '#9e2f26' },
      { w: '10px', h: '90px', c: '#b08a2e' },
      { w: '5px', h: '36px', c: '#8d877d' },
    ];
    const segs = [
      { grow: 4, ratio: 1 },
      { grow: 4, ratio: 0.5 },
      { grow: 3, ratio: 0 },
      { grow: 3, ratio: 0 },
      { grow: 4, ratio: 0 },
    ];
    return {
      p,
      bar: '#9a958c',
      successTint: p.success + '24',
      left: plates.slice().reverse(),
      right: plates,
      segments: segs.map((s) => ({
        grow: s.grow,
        width: Math.round(s.ratio * 100) + '%',
        fill: s.ratio >= 1 ? p.success : p.accent,
      })),
    };
  }
}
</script>
</body>
</html>
