<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Repos immersif</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{p.bg}}; color: {{p.text}}; font-family: 'Hanken Grotesk', sans-serif; display: flex; flex-direction: column; align-items: center;">
  <div style="align-self: stretch; padding: 44px 12px 0; display: flex; align-items: center;">
    <button aria-label="Quitter la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; padding: 0;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{p.text}}" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
    <span style="flex-grow: 1; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700;">33:40</span>
    <div style="width: 44px; height: 44px;"></div>
  </div>
  <span style="margin-top: 26px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1.6px; color: {{p.muted}};">REPOS</span>

  <div style="position: relative; width: 280px; height: 280px; margin-top: 18px;">
    <svg width="280" height="280" viewBox="0 0 280 280" style="position: absolute; left: 0; top: 0;">
      <circle cx="140" cy="140" r="124" fill="none" stroke="{{p.track}}" stroke-width="14"></circle>
      <circle cx="140" cy="140" r="124" fill="none" stroke="{{p.accent}}" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 140 140)"></circle>
    </svg>
    <div style="position: absolute; left: 0; top: 0; width: 280px; height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 68px; letter-spacing: -2.5px; line-height: 72px;">1:24</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: {{p.muted}};">sur 2:00</span>
    </div>
  </div>

  <div style="align-self: stretch; margin: 30px 16px 0; padding: 16px 18px; border-radius: 22px; background: {{p.surface}}; border: 1px solid {{p.border}}; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 600; color: {{p.muted}};">Ensuite · Série 4/4</span>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px;">Squat</span>
      <span style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700;">8 × 102,5 kg</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.muted}}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>
      <span style="font-size: 14px; color: {{p.muted}};">Rien à changer sur la barre</span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; gap: 10px;">
    <button style="flex-grow: 1; flex-basis: 0; height: 56px; border-radius: 16px; background: {{p.alt}}; border: none; color: {{p.text}}; font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: 16px;">+30 s</button>
    <button style="flex-grow: 2; flex-basis: 0; height: 56px; border-radius: 16px; background: {{p.accent}}; border: none; color: {{p.onAccent}}; font-family: 'Hanken Grotesk', sans-serif; font-weight: 700; font-size: 17px;">Passer le repos</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"p":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p ?? {
      bg: '#221210', surface: '#3c211f', alt: '#472824', border: '#472824', track: '#472824',
      text: '#f4ecdd', muted: '#c9b79a', accent: '#e07a98', onAccent: '#1c150e', success: '#a9ba7e',
    };
    const circumference = 2 * Math.PI * 124;
    const left = 84 / 120;
    return { p, dash: Math.round(circumference * left) + ' ' + Math.round(circumference) };
  }
}
</script>
</body>
</html>
