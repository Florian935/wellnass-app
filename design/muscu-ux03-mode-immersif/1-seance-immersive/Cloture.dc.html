<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #1c150e; }
    a { color: #e0a97f; }
    a:hover { color: #f4ecdd; }
    .ph {
      width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box;
      background: radial-gradient(140% 60% at 15% -5%, rgba(221,110,64,.26) 0%, rgba(221,110,64,0) 58%), #1c150e;
      color: #f4ecdd; font-family: 'Hanken Grotesk', system-ui, sans-serif;
      padding: 0 22px;
    }
    .ic { display: block; flex: none; }
    .eyebrow {
      font-family: 'Space Mono', ui-monospace, monospace; font-size: 10.5px;
      letter-spacing: 1.4px; text-transform: uppercase; color: #c9b79a;
    }
    /* Cycle 8 s : la cérémonie rejoue, l'état figé est l'état final */
    .in { animation-duration: 8s; animation-iteration-count: infinite; animation-delay: -4s; }
    .slam { animation-name: slam; }
    @keyframes slam {
      0% { opacity: 0; transform: translateY(-26px) scale(1.04); }
      5% { opacity: 1; transform: translateY(4px) scale(1); }
      7.5%, 100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .rise { animation-name: rise; }
    @keyframes rise {
      0%, 6% { opacity: 0; transform: translateY(16px); }
      12%, 100% { opacity: 1; transform: translateY(0); }
    }
    .rise2 { animation-name: rise2; }
    @keyframes rise2 {
      0%, 10% { opacity: 0; transform: translateY(16px); }
      16%, 100% { opacity: 1; transform: translateY(0); }
    }
    .rise3 { animation-name: rise3; }
    @keyframes rise3 {
      0%, 14% { opacity: 0; transform: translateY(16px); }
      20%, 100% { opacity: 1; transform: translateY(0); }
    }

    .top { padding-top: 58px; }
    .title {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800;
      font-size: 66px; letter-spacing: -2.8px; line-height: .9; margin-top: 12px;
    }
    .sub { font-size: 16px; color: #c9b79a; margin-top: 14px; }

    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 26px; }
    .st { padding: 14px 0 14px; border-top: 1px solid #3a2e22; display: flex; flex-direction: column; gap: 4px; }
    .st:nth-child(even) { padding-left: 18px; border-left: 1px solid #3a2e22; }
    .st-n { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -1.4px; line-height: 1; font-variant-numeric: tabular-nums; }
    .st-l { font-family: 'Space Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #c9b79a; }

    .cmp { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #a9ba7e; }

    .recs { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
    .rec { display: flex; align-items: center; gap: 12px; height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; background: rgba(224,177,85,.08); border: 1px solid rgba(224,177,85,.26); }
    .rec-name { flex: 1; font-size: 14.5px; font-weight: 600; }
    .rec-v { text-align: right; font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 13px; color: #e0b155; }
    .rec-t { font-family: 'Hanken Grotesk', system-ui, sans-serif; font-weight: 500; font-size: 11px; color: #c9b79a; }

    .streak { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #c9b79a; }
    .streak b { color: #f4ecdd; }

    .foot { position: absolute; left: 22px; right: 22px; bottom: 14px; display: flex; flex-direction: column; gap: 2px; }
    .go {
      height: 64px; border-radius: 20px; background: #dd6e40; color: #1c150e;
      display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
      box-shadow: 0 14px 32px -12px rgba(221,110,64,.7);
    }
    .ghost { height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: #c9b79a; }
  </style>
</helmet>

<div class="ph">
  <div class="top">
    <div class="eyebrow in rise">Push A · dimanche 13/09</div>
    <div class="title in slam">Séance<br>bouclée.</div>
    <div class="sub in rise">18 séries sur 18, en 58 minutes.</div>
  </div>

  <div class="stats in rise2">
    <div class="st"><div class="st-n">58:12</div><div class="st-l">Durée</div></div>
    <div class="st"><div class="st-n">8 420</div><div class="st-l">kg soulevés</div></div>
    <div class="st"><div class="st-n">18</div><div class="st-l">Séries</div></div>
    <div class="st"><div class="st-n" style="color: #e0b155">2</div><div class="st-l">Records</div></div>
  </div>

  <div class="cmp in rise2"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>6 % de tonnage en plus que mardi</div>

  <div class="recs in rise3">
    <div class="rec">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e0b155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.5a2.5 2.5 0 0 0 2.6 3.6M16 6h2.5a2.5 2.5 0 0 1-2.6 3.6"/><path d="M12 13v4M8.5 20h7"/></svg>
      <div class="rec-name">Développé couché</div>
      <div class="rec-v">82,5 kg<div class="rec-t">charge max</div></div>
    </div>
    <div class="rec">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e0b155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.5a2.5 2.5 0 0 0 2.6 3.6M16 6h2.5a2.5 2.5 0 0 1-2.6 3.6"/><path d="M12 13v4M8.5 20h7"/></svg>
      <div class="rec-name">Dips lestés</div>
      <div class="rec-v">+20 kg × 8<div class="rec-t">1RM estimé</div></div>
    </div>
  </div>

  <div class="streak in rise3"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e0a97f" stroke-width="2" stroke-linejoin="round"><path d="M12 3c1 3 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5.5.3 1.7 1 2.7 2 3.2C11 8.5 11.5 5.5 12 3z"/></svg><span><b>12 jours d'affilée</b> · aujourd'hui compte</span></div>

  <div class="foot">
    <div class="go">Voir le bilan</div>
    <div class="ghost"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Partager la séance</div>
  </div>
</div>
</x-dc>
</body>
</html>
