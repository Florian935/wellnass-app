<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #f7eede; }
    a { color: #b14f2b; }
    a:hover { color: #8a3c1f; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes impact { 0% { transform: scale(.55); opacity: .55; } 100% { transform: scale(1.12); opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -64; } }
    @keyframes level { from { transform: translateX(0); } to { transform: translateX(-48px); } }
    @keyframes halo { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.5); opacity: 0; } }
    @keyframes souffle { 0%, 100% { transform: scale(.985); opacity: .45; } 50% { transform: scale(1.015); opacity: .8; } }
    @keyframes rise { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fb { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: #f7eede; color: #33291f; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="flex: none; position: relative; overflow: hidden; background: radial-gradient(72% 58% at 12% 8%, rgba(107,0,40,.92) 0%, rgba(107,0,40,0) 72%), radial-gradient(70% 56% at 94% 14%, rgba(42,100,173,.9) 0%, rgba(42,100,173,0) 72%), radial-gradient(90% 60% at 50% 104%, rgba(58,86,34,.95) 0%, rgba(58,86,34,0) 74%), #1c150e; color: #fff; border-radius: 0 0 30px 30px; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 8px; ">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
      <div style="display: flex; align-items: center; gap: 6px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg><div style="font-weight: 600; font-size: 14px;">Composer</div></div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); box-sizing: border-box; font-weight: 700; font-size: 13px; color: #fff; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M4 16l5-6 4 3 7-8"></path></svg>Projeter</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -.8px; line-height: 1.05;">Hybride d'automne · v3</div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(255,255,255,.82);"><span style="font-weight: 700; font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 2px 8px;">Brouillon</span>Rien ne change avant de lancer le cycle.</div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <svg width="176" height="150" viewBox="0 0 200 170" style="display: block; flex: none;">
        <defs>
          <radialGradient id="cg-m" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e07a98" stop-opacity=".6"></stop><stop offset="1" stop-color="#e07a98" stop-opacity=".1"></stop></radialGradient>
          <radialGradient id="cg-c" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6fa8ef" stop-opacity=".6"></stop><stop offset="1" stop-color="#6fa8ef" stop-opacity=".1"></stop></radialGradient>
          <radialGradient id="cg-n" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a9ba7e" stop-opacity=".6"></stop><stop offset="1" stop-color="#a9ba7e" stop-opacity=".1"></stop></radialGradient>
        </defs>
        <g style="mix-blend-mode: screen; animation: {{ shake }};">
          <circle cx="72" cy="62" r="{{ rm }}" fill="url(#cg-m)" stroke="#e07a98" stroke-width="1.5" style="transition: r .35s ease;"></circle>
          <circle cx="128" cy="62" r="{{ rc }}" fill="url(#cg-c)" stroke="#6fa8ef" stroke-width="1.5" style="transition: r .35s ease;"></circle>
          <circle cx="100" cy="110" r="{{ rn }}" fill="url(#cg-n)" stroke="#a9ba7e" stroke-width="1.5" style="transition: r .35s ease;"></circle>
        </g>
        <sc-if value="{{ zmc.show }}" hint-placeholder-val="{{ true }}">
          <circle cx="100" cy="42" r="10" fill="{{ zmc.fill }}" stroke="{{ zmc.ring }}" stroke-width="2"></circle>
          <text x="100" y="45.6" font-family="Space Mono, monospace" font-size="10" font-weight="700" fill="{{ zmc.fg }}" text-anchor="middle">{{ zmc.n }}</text>
        </sc-if>
        <sc-if value="{{ zmn.show }}" hint-placeholder-val="{{ true }}">
          <circle cx="70" cy="96" r="10" fill="{{ zmn.fill }}" stroke="{{ zmn.ring }}" stroke-width="2"></circle>
          <text x="70" y="99.6" font-family="Space Mono, monospace" font-size="10" font-weight="700" fill="{{ zmn.fg }}" text-anchor="middle">{{ zmn.n }}</text>
        </sc-if>
        <sc-if value="{{ zcn.show }}" hint-placeholder-val="{{ true }}">
          <circle cx="130" cy="96" r="10" fill="{{ zcn.fill }}" stroke="{{ zcn.ring }}" stroke-width="2"></circle>
          <text x="130" y="99.6" font-family="Space Mono, monospace" font-size="10" font-weight="700" fill="{{ zcn.fg }}" text-anchor="middle">{{ zcn.n }}</text>
        </sc-if>
        <sc-if value="{{ ztri.show }}" hint-placeholder-val="{{ true }}">
          <circle cx="100" cy="76" r="10" fill="{{ ztri.fill }}" stroke="{{ ztri.ring }}" stroke-width="2"></circle>
          <text x="100" y="79.6" font-family="Space Mono, monospace" font-size="10" font-weight="700" fill="{{ ztri.fg }}" text-anchor="middle">{{ ztri.n }}</text>
        </sc-if>
      </svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -.4px; line-height: 1.1; color: {{ verdictColor }};">{{ verdict }}</div>
        <sc-for list="{{ gauges }}" as="g" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; justify-content: space-between; font-size: 12px;"><span style="font-weight: 600;">{{ g.label }}</span><span style="font-weight: 700; color: {{ g.color }};">{{ g.word }}</span></div>
            <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: hidden;"><div style="height: 6px; border-radius: 3px; width: {{ g.pct }}%; background: {{ g.color }}; transition: width .35s ease;"></div></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 22px; min-height: 0;">
    <div style="display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: #786a59;">Croisements</div><div style="font-size: 12px; color: #786a59;">{{ reacCount }}</div></div>
      <div style="display: flex; flex-direction: column; gap: 5px; height: 154px;">
        <sc-for list="{{ reactions }}" as="r" hint-placeholder-count="3">
          <div style="display: flex; gap: 10px; align-items: center; box-sizing: border-box; min-height: 48px; padding: 6px 12px; border-radius: 14px; background: {{ r.bg }}; border: 1px solid {{ r.border }}; animation: rise .3s ease-out both;">
            <svg width="26" height="22" viewBox="0 0 26 22" style="flex: none;"><circle cx="9" cy="11" r="7.5" fill="{{ r.ca }}" fill-opacity=".2" stroke="{{ r.ca }}" stroke-width="1.6"></circle><circle cx="17" cy="11" r="7.5" fill="{{ r.cb }}" fill-opacity=".2" stroke="{{ r.cb }}" stroke-width="1.6"></circle></svg>
            <div style="flex: 1; display: flex; flex-direction: column;">
              <div style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-weight: 700; font-size: 13.5px;">{{ r.title }}</span><span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 9.5px; font-weight: 700; color: {{ r.fg }}; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; margin-top: 2px;">{{ r.kindLabel }}</span></div>
              <div style="font-size: 12.5px; line-height: 16px; color: #786a59;">{{ r.text }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 2px;"><div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: #786a59;">Leviers</div><div style="font-size: 12px; color: #786a59;">+ 3 inchangés</div></div>
      <sc-for list="{{ levers }}" as="l" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; border-bottom: 1px solid #ece0cd;">
          <div style="width: 34px; height: 34px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{ l.soft }}; border: 1px solid {{ l.line }};">
            <sc-if value="{{ l.isMuscu }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b0028" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="18" y2="12"></line><rect x="3" y="8" width="3" height="8" rx="1"></rect><rect x="18" y="8" width="3" height="8" rx="1"></rect><line x1="1.5" y1="10.5" x2="1.5" y2="13.5"></line><line x1="22.5" y1="10.5" x2="22.5" y2="13.5"></line></svg></sc-if>
            <sc-if value="{{ l.isCourse }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2a64ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3 0 3-4 6-4s3 4 6 4 3-7 6-7"></path><circle cx="21" cy="10" r="1.2" fill="#2a64ad"></circle></svg></sc-if>
            <sc-if value="{{ l.isNutrition }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52703a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-5 0-8-4-8-9 0-4 3-6 5-6 1.5 0 2.3.7 3 .7s1.5-.7 3-.7c2 0 5 2 5 6 0 5-3 9-8 9z"></path><path d="M12 7c0-2 1-4 3-4"></path></svg></sc-if>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column;"><div style="font-weight: 700; font-size: 14px;">{{ l.name }}</div><div style="font-size: 11.5px; color: {{ l.color }}; font-weight: 600;">{{ l.pillar }}</div></div>
          <sc-if value="{{ l.isStepper }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center;">
              <div onClick="{{ l.minus }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{ l.minusOp }};"><div style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #90897d; display: flex; align-items: center; justify-content: center; box-sizing: border-box;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#33291f" stroke-width="2.8" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg></div></div>
              <div style="min-width: 76px; text-align: center; font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 12.5px;">{{ l.dose }}</div>
              <div onClick="{{ l.plus }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{ l.plusOp }};"><div style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #90897d; display: flex; align-items: center; justify-content: center; box-sizing: border-box;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#33291f" stroke-width="2.8" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="12" y1="5" x2="12" y2="19"></line></svg></div></div>
            </div>
          </sc-if>
          <sc-if value="{{ l.isToggle }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ l.toggle }}" style="height: 44px; display: flex; align-items: center; gap: 10px; cursor: pointer; padding-right: 4px;">
              <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 12.5px;">{{ l.dose }}</div>
              <div style="width: 46px; height: 28px; border-radius: 14px; background: {{ l.trackBg }}; position: relative; transition: background .2s;"><div style="position: absolute; top: 3px; left: {{ l.knobLeft }}px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s;"></div></div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-sizing: border-box; background: {{ ctaBg }}; color: {{ ctaInk }}; border: 1.5px solid {{ ctaBorder }};">{{ ctaText }}</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { fq: 4, km: 30, kc: 1, gl: false };

  renderVals() {
    var s = this.state;
    var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
    var KC = [0, -250, -500];
    var charge = s.fq * 9 + s.km * 1.4 + 12;
    var base = 3 * 9 + 25 * 1.4 + 12;
    var jump = Math.round((charge / base - 1) * 100);
    var recup = clamp(Math.round(104 - Math.max(0, charge - 60) * 1.1 - [0, 10, 26][s.kc]), 6, 100);
    var fuel = clamp(Math.round(72 + (s.gl ? 16 : 0) - [0, 14, 34][s.kc] - Math.max(0, s.km - 25) * 1.2), 6, 100);
    var guard = s.kc === 2 && (s.km >= 35 || s.fq >= 5);
    var M = '#6b0028', C = '#2a64ad', N = '#52703a';
    var R = [];
    if (guard) R.push({ kind: 'guard', zone: 'ztri', ca: C, cb: N, title: 'Déficit × volume', text: '−500 kcal avec ' + s.km + ' km : le cycle ne peut pas partir.' });
    if (s.fq >= 4 && s.km >= 30) R.push({ kind: 'tension', zone: 'zmc', ca: M, cb: C, title: 'Jambes × fractionné', text: 'Squat lundi, 800 m mardi : ~3 s par fraction.' });
    if (jump > 15) R.push({ kind: 'tension', zone: 'zmc', ca: M, cb: C, title: 'Charge combinée +' + jump + ' %', text: 'Au-delà de +10 %, la récup ne suit plus.' });
    if (s.kc === 2 && !guard) R.push({ kind: 'tension', zone: 'zmn', ca: N, cb: M, title: 'Déficit × force', text: 'À −500 kcal en v1, ton squat a perdu 3 %.' });
    if (s.gl) R.push({ kind: 'syn', zone: 'zcn', ca: N, cb: C, title: 'Glucides × fractionné', text: '+1,5 g/kg les jours durs : l\u2019allure tient.' });
    if (s.fq >= 3 && s.kc < 2) R.push({ kind: 'syn', zone: 'zmn', ca: N, cb: M, title: 'Protéines × musculation', text: '1,8 g/kg couvre tes séances, même en déficit.' });

    var TONES = {
      syn: { label: 'synergie', fg: '#66714b', bg: 'rgba(102,113,75,.08)', border: 'rgba(102,113,75,.28)', fill: '#f2d28a', ring: '#f2d28a', mfg: '#1c150e' },
      tension: { label: 'tension', fg: '#8a6419', bg: '#f7ead6', border: '#e9cfa0', fill: '#1c150e', ring: '#e0b155', mfg: '#e0b155' },
      guard: { label: 'garde-fou', fg: '#b23b2e', bg: 'rgba(178,59,46,.07)', border: 'rgba(178,59,46,.35)', fill: '#f08a7e', ring: '#f08a7e', mfg: '#1c150e' },
    };
    var order = { guard: 0, tension: 1, syn: 2 };
    R.sort(function (a, b) { return order[a.kind] - order[b.kind]; });
    var reactions = R.slice(0, 3).map(function (r) { var t = TONES[r.kind]; return Object.assign({}, r, { kindLabel: t.label, fg: t.fg, bg: t.bg, border: t.border }); });
    var zone = function (z) {
      var list = R.filter(function (r) { return r.zone === z; });
      if (!list.length) return { show: false, n: '', fill: 'none', ring: 'none', fg: 'none' };
      var t = TONES[list[0].kind];
      return { show: true, n: list.length, fill: t.fill, ring: t.ring, fg: t.mfg };
    };
    var nTension = R.filter(function (r) { return r.kind !== 'syn'; }).length;
    var tone = function (v) { return v < 35 ? '#f08a7e' : v < 60 ? '#e0b155' : '#a9ba7e'; };
    var set = function (k, v) { return function () { this.setState({ [k]: v }); }.bind(this); }.bind(this);
    var KMS = [20, 25, 30, 35, 40], kmI = KMS.indexOf(s.km);
    return {
      rm: 30 + s.fq * 4.6, rc: 29 + s.km * 0.55, rn: 44 + (s.gl ? 5 : 0) - [0, 3, 8][s.kc],
      shake: nTension && !guard ? 'none' : 'none',
      zmc: zone('zmc'), zmn: zone('zmn'), zcn: zone('zcn'), ztri: zone('ztri'),
      verdict: guard ? 'Formule bloquée' : nTension ? 'Tes piliers se gênent' : 'Tes piliers s\u2019accordent',
      verdictColor: guard ? '#f08a7e' : nTension ? '#e0b155' : '#c5d69a',
      gauges: [
        { label: 'Charge', pct: clamp(Math.round(charge / 1.2), 6, 100), word: charge > 90 ? 'élevée' : charge > 60 ? 'productive' : 'légère', color: charge > 90 ? '#e0b155' : '#a9ba7e' },
        { label: 'Récupération', pct: recup, word: recup < 35 ? 'à la traîne' : recup < 60 ? 'juste' : 'suit', color: tone(recup) },
        { label: 'Énergie', pct: fuel, word: fuel < 35 ? 'à sec' : fuel < 60 ? 'juste' : 'pleine', color: tone(fuel) },
      ],
      reactions: reactions,
      reacCount: R.length > 3 ? '3 sur ' + R.length : R.length + (R.length > 1 ? ' actifs' : ' actif'),
      levers: [
        { name: 'Musculation', pillar: 'séances par semaine', color: '#6b0028', soft: 'rgba(107,0,40,.08)', line: 'rgba(107,0,40,.22)', isMuscu: true, isStepper: true, dose: s.fq + ' / sem', minus: set('fq', Math.max(2, s.fq - 1)), plus: set('fq', Math.min(5, s.fq + 1)), minusOp: s.fq > 2 ? 1 : .35, plusOp: s.fq < 5 ? 1 : .35 },
        { name: 'Course', pillar: 'km · dont 1 fractionné', color: '#2a64ad', soft: 'rgba(42,100,173,.08)', line: 'rgba(42,100,173,.24)', isCourse: true, isStepper: true, dose: s.km + ' km', minus: set('km', KMS[Math.max(0, kmI - 1)]), plus: set('km', KMS[Math.min(4, kmI + 1)]), minusOp: kmI > 0 ? 1 : .35, plusOp: kmI < 4 ? 1 : .35 },
        { name: 'Balance calorique', pillar: 'par jour', color: '#52703a', soft: 'rgba(82,112,58,.09)', line: 'rgba(82,112,58,.26)', isNutrition: true, isStepper: true, dose: KC[s.kc] === 0 ? 'maintien' : String(KC[s.kc]).replace('-', '\u2212') + ' kcal', minus: set('kc', Math.min(2, s.kc + 1)), plus: set('kc', Math.max(0, s.kc - 1)), minusOp: s.kc < 2 ? 1 : .35, plusOp: s.kc > 0 ? 1 : .35 },
        { name: 'Glucides périodisés', pillar: 'les jours durs', color: '#52703a', soft: 'rgba(82,112,58,.09)', line: 'rgba(82,112,58,.26)', isNutrition: true, isStepper: false, isToggle: true, dose: s.gl ? 'oui' : 'non', toggle: set('gl', !s.gl), trackBg: s.gl ? '#52703a' : '#d9c7ab', knobLeft: s.gl ? 21 : 3 },
      ],
      ctaText: guard ? 'Corrige le garde-fou pour lancer' : 'Lancer le cycle · 8 semaines',
      ctaBg: guard ? 'transparent' : '#b14f2b', ctaInk: guard ? '#786a59' : '#ffffff', ctaBorder: guard ? '#d9c7ab' : '#b14f2b',
    };
  }
}
</script>
</body>
</html>
