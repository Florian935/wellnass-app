<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #120d08; }
    a { color: #e0a97f; }
    a:hover { color: #f2c9a4; }
    @keyframes wob { from { transform: translateX(-2.5px); } to { transform: translateX(2.5px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes smoke { 0% { opacity: 0; transform: translateY(0) scale(.6); } 30% { opacity: .5; } 100% { opacity: 0; transform: translateY(-26px) scale(1.4); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
    .sm { transform-box: fill-box; transform-origin: center; animation: smoke 2.4s ease-out infinite; }
    .rx { animation: reveal .35s ease-out both; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: radial-gradient(110% 50% at 20% 0%, #33261a 0%, #1c150e 55%, #120d08 100%); color: #f4ecdd; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 20px 22px; gap: 10px;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f4ecdd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      <div style="font-weight: 600; font-size: 14px;">Paillasse</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(244,236,221,.12); box-sizing: border-box; font-weight: 700; font-size: 13px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f4ecdd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M4 16l5-6 4 3 7-8"></path></svg>
      Projeter
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -.8px; line-height: 1.05;">Hybride d'automne · v3</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c9b79a;">
      <div style="font-weight: 700; font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; color: #c9b79a; border: 1px solid rgba(244,236,221,.24); border-radius: 999px; padding: 2px 8px;">Brouillon</div>
      <div>Rien ne change avant l'incubation.</div>
    </div>
  </div>

  <!-- ballon + équilibre -->
  <div style="display: flex; gap: 14px; align-items: center; height: 170px;">
    <svg width="150" height="170" viewBox="0 0 150 170" style="display: block; flex: none;">
      <defs>
        <clipPath id="fl"><path d="M63,22 L63,48.3 A58,58 0 1,0 87,48.3 L87,22 Z"></path></clipPath>
        <radialGradient id="hl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="{{glow}}" stop-opacity=".5"></stop><stop offset="1" stop-color="{{glow}}" stop-opacity="0"></stop></radialGradient>
      </defs>
      <circle cx="75" cy="112" r="74" fill="url(#hl)"></circle>
      <g clip-path="url(#fl)" style="opacity: {{liqOpacity}};">
        <g style="animation: {{anim}};">
          <rect x="0" y="{{bs.y}}" width="150" height="{{bs.h}}" fill="#e0b155"></rect>
          <rect x="0" y="{{bm.y}}" width="150" height="{{bm.h}}" fill="#e07a98"></rect>
          <rect x="0" y="{{bc.y}}" width="150" height="{{bc.h}}" fill="#6fa8ef"></rect>
          <rect x="0" y="{{bn.y}}" width="150" height="{{bn.h}}" fill="#a9ba7e"></rect>
        </g>
      </g>
      <path d="M63,22 L63,48.3 A58,58 0 1,0 87,48.3 L87,22 Z" fill="rgba(255,255,255,.04)" stroke="rgba(244,236,221,.62)" stroke-width="2"></path>
      <path d="M36,82 A48,48 0 0,0 38,140" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="4" stroke-linecap="round"></path>
      <sc-if value="{{hasSyn}}" hint-placeholder-val="{{ true }}">
        <path class="tw" d="M112,40 l2.5,6.5 6.5,2.5 -6.5,2.5 -2.5,6.5 -2.5,-6.5 -6.5,-2.5 6.5,-2.5z" fill="#f2d28a" style="animation-delay: -.2s;"></path>
        <path class="tw" d="M28,58 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z" fill="#f2d28a" style="animation-delay: -1s;"></path>
        <path class="tw" d="M124,96 l1.6,4 4,1.6 -4,1.6 -1.6,4 -1.6,-4 -4,-1.6 4,-1.6z" fill="#f2d28a" style="animation-delay: -1.4s;"></path>
      </sc-if>
      <sc-if value="{{hasTension}}" hint-placeholder-val="{{ false }}">
        <circle class="sm" cx="70" cy="14" r="7" fill="#8a7e72"></circle>
        <circle class="sm" cx="82" cy="10" r="5" fill="#8a7e72" style="animation-delay: -1.1s;"></circle>
      </sc-if>
      <sc-if value="{{guard}}" hint-placeholder-val="{{ false }}">
        <rect x="59" y="10" width="32" height="16" rx="4" fill="#8a6419" stroke="#e0b155" stroke-width="1.5"></rect>
      </sc-if>
    </svg>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 11px;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -.4px; line-height: 1.1; color: {{verdictColor}};">{{verdict}}</div>
      <sc-for list="{{gauges}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="display: flex; justify-content: space-between; font-size: 12px;"><span style="font-weight: 600;">{{g.label}}</span><span style="color: {{g.color}}; font-weight: 700;">{{g.word}}</span></div>
          <div style="height: 6px; border-radius: 3px; background: rgba(244,236,221,.12); overflow: hidden;"><div style="height: 6px; border-radius: 3px; width: {{g.pct}}%; background: {{g.color}}; transition: width .35s ease;"></div></div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- réactions -->
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: #c9b79a;">Réactions</div>
      <div style="font-size: 12px; color: #c9b79a;">{{reacCount}}</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; height: 162px;">
      <sc-for list="{{reactions}}" as="r" hint-placeholder-count="3">
        <div class="rx" style="display: flex; gap: 10px; align-items: flex-start; box-sizing: border-box; min-height: 50px; padding: 8px 12px; border-radius: 14px; background: {{r.bg}}; border: 1px solid {{r.border}};">
          <div style="width: 22px; height: 22px; flex: none; margin-top: 1px;">
            <sc-if value="{{r.isSyn}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#f2d28a"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"></path></svg></sc-if>
            <sc-if value="{{r.isTension}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0b155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l3-7 4 14 3-9 2 2h5"></path></svg></sc-if>
            <sc-if value="{{r.isGuard}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f08a7e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12" y2="16"></line></svg></sc-if>
          </div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
            <div style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-weight: 700; font-size: 13.5px;">{{r.title}}</span><span style="font-family: 'Space Mono', ui-monospace, monospace; font-size: 9.5px; color: #c9b79a; white-space: nowrap; margin-top: 2px;">{{r.src}}</span></div>
            <div style="font-size: 12.5px; line-height: 16px; color: #d9ccb6;">{{r.text}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- éléments dosés -->
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 10.5px; letter-spacing: 1.3px; text-transform: uppercase; color: #c9b79a;">Doses</div>
      <div style="font-size: 12px; color: #c9b79a;">+ 3 éléments inchangés</div>
    </div>
    <sc-for list="{{levers}}" as="l" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; border-bottom: 1px solid rgba(244,236,221,.1);">
        <div style="width: 34px; height: 34px; flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: {{l.tint}}; border: 1.5px solid {{l.color}}; box-sizing: border-box; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 14px; color: {{l.color}};">{{l.sym}}</div>
        <div style="flex: 1; display: flex; flex-direction: column;"><div style="font-weight: 700; font-size: 14px;">{{l.name}}</div><div style="font-size: 11.5px; color: #c9b79a;">{{l.pillar}}</div></div>
        <sc-if value="{{l.isStepper}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 2px;">
            <div onClick="{{l.minus}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{l.minusOp}};"><div style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(244,236,221,.4); display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f4ecdd" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg></div></div>
            <div style="min-width: 78px; text-align: center; font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 13px;">{{l.dose}}</div>
            <div onClick="{{l.plus}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{l.plusOp}};"><div style="width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid rgba(244,236,221,.4); display: flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f4ecdd" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="12" y1="5" x2="12" y2="19"></line></svg></div></div>
          </div>
        </sc-if>
        <sc-if value="{{l.isToggle}}" hint-placeholder-val="{{ false }}">
          <div onClick="{{l.toggle}}" style="height: 44px; display: flex; align-items: center; gap: 10px; cursor: pointer; padding-right: 6px;">
            <div style="font-family: 'Space Mono', ui-monospace, monospace; font-weight: 700; font-size: 13px;">{{l.dose}}</div>
            <div style="width: 46px; height: 28px; border-radius: 14px; background: {{l.trackBg}}; position: relative; transition: background .2s;"><div style="position: absolute; top: 3px; left: {{l.knobLeft}}px; width: 22px; height: 22px; border-radius: 50%; background: #f4ecdd; transition: left .2s;"></div></div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; background: {{ctaBg}}; color: {{ctaInk}}; border: 1.5px solid {{ctaBorder}}; box-sizing: border-box;">{{ctaText}}</div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { fq: 4, km: 30, kc: 1, gl: false };

  renderVals() {
    const s = this.state;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const KC = [0, -250, -500];
    const charge = s.fq * 9 + s.km * 1.4 + 12;
    const base = 3 * 9 + 25 * 1.4 + 12;
    const jump = Math.round((charge / base - 1) * 100);
    const recup = clamp(Math.round(104 - Math.max(0, charge - 60) * 1.1 - [0, 10, 26][s.kc]), 6, 100);
    const fuel = clamp(Math.round(72 + (s.gl ? 16 : 0) - [0, 14, 34][s.kc] - Math.max(0, s.km - 25) * 1.2), 6, 100);
    const guard = s.kc === 2 && (s.km >= 35 || s.fq >= 5);

    const R = [];
    if (guard) R.push({ kind: 'guard', title: 'Garde-fou · sous-alimentation', text: String(KC[s.kc]).replace('-', '−') + ' kcal avec ' + s.km + ' km : pas d’incubation.', src: 'RN-10 · GARDE-01' });
    if (s.fq >= 4 && s.km >= 30) R.push({ kind: 'tension', title: 'Jambes × fractionné', text: 'Squat lundi, 800 m mardi : ~3 s par fraction.', src: 'MR-08 · COLLIS-01' });
    if (jump > 15) R.push({ kind: 'tension', title: 'Montée trop rapide · +' + jump + ' %', text: 'Au-delà de +10 %, la récup ne suit plus.', src: 'META-19 · MR-11' });
    if (s.kc === 2 && !guard) R.push({ kind: 'tension', title: 'Déficit × force', text: 'À −500 kcal en v1, ton squat a perdu 3 %.', src: 'MN-08 · ton carnet' });
    if (s.gl) R.push({ kind: 'syn', title: 'Glucides × fractionné', text: '+1,5 g/kg les jours durs : l’allure tient.', src: 'FUEL-01 · RN-06' });
    if (s.fq >= 3 && s.kc < 2) R.push({ kind: 'syn', title: 'Protéines × musculation', text: '1,8 g/kg couvre tes séances, même en déficit.', src: 'MN-06' });

    const style = {
      syn: { bg: 'rgba(242,210,138,.08)', border: 'rgba(242,210,138,.28)' },
      tension: { bg: 'rgba(224,177,85,.07)', border: 'rgba(224,177,85,.3)' },
      guard: { bg: 'rgba(240,138,126,.1)', border: 'rgba(240,138,126,.45)' },
    };
    const reactions = R.slice(0, 3).map((r) => Object.assign({}, r, style[r.kind], { isSyn: r.kind === 'syn', isTension: r.kind === 'tension', isGuard: r.kind === 'guard' }));
    const nTension = R.filter((r) => r.kind !== 'syn').length;
    const hasSyn = R.some((r) => r.kind === 'syn') && !guard;
    const hasTension = nTension > 0 && !guard;

    // bandes du ballon, empilées depuis le fond (y = 163)
    const gap = hasTension ? 3 : 0;
    let y = 164;
    const band = (h) => { y -= h; const b = { y: y, h: h }; y -= gap; return b; };
    const bn = band(24 + (s.gl ? 8 : 0) + [0, -3, -7][s.kc]);
    const bc = band(10 + s.km * 0.62);
    const bm = band(8 + s.fq * 5.5);
    const bs = band(7);

    const word = (v, lo, hi, words) => (v < lo ? words[0] : v < hi ? words[1] : words[2]);
    const tone = (v) => (v < 35 ? '#f08a7e' : v < 60 ? '#e0b155' : '#a9ba7e');
    const chargePct = clamp(Math.round((charge / 120) * 100), 6, 100);
    const gauges = [
      { label: 'Charge', pct: chargePct, word: charge > 90 ? 'élevée' : charge > 60 ? 'productive' : 'légère', color: charge > 90 ? '#e0b155' : '#a9ba7e' },
      { label: 'Récupération', pct: recup, word: word(recup, 35, 60, ['à la traîne', 'juste', 'suit']), color: tone(recup) },
      { label: 'Carburant', pct: fuel, word: word(fuel, 35, 60, ['à sec', 'juste', 'plein']), color: tone(fuel) },
    ];

    const set = (k, v) => () => this.setState({ [k]: v });
    const KMS = [20, 25, 30, 35, 40];
    const kmI = KMS.indexOf(s.km);
    const levers = [
      { sym: 'Fq', name: 'Musculation', pillar: 'Muscu · séances', color: '#e07a98', tint: 'rgba(224,122,152,.12)', isStepper: true, dose: s.fq + ' / sem', minus: set('fq', Math.max(2, s.fq - 1)), plus: set('fq', Math.min(5, s.fq + 1)), minusOp: s.fq > 2 ? 1 : 0.35, plusOp: s.fq < 5 ? 1 : 0.35 },
      { sym: 'Km', name: 'Volume de course', pillar: 'Course · 1 fractionné', color: '#6fa8ef', tint: 'rgba(111,168,239,.12)', isStepper: true, dose: s.km + ' km', minus: set('km', KMS[Math.max(0, kmI - 1)]), plus: set('km', KMS[Math.min(4, kmI + 1)]), minusOp: kmI > 0 ? 1 : 0.35, plusOp: kmI < 4 ? 1 : 0.35 },
      { sym: 'Kc', name: 'Balance calorique', pillar: 'Nutrition · par jour', color: '#a9ba7e', tint: 'rgba(169,186,126,.12)', isStepper: true, dose: KC[s.kc] === 0 ? 'maintien' : String(KC[s.kc]).replace('-', '−') + ' kcal', minus: set('kc', Math.min(2, s.kc + 1)), plus: set('kc', Math.max(0, s.kc - 1)), minusOp: s.kc < 2 ? 1 : 0.35, plusOp: s.kc > 0 ? 1 : 0.35 },
      { sym: 'Gl', name: 'Glucides périodisés', pillar: 'Nutrition · jours durs', color: '#a9ba7e', tint: 'rgba(169,186,126,.12)', isStepper: false, isToggle: true, dose: s.gl ? 'oui' : 'non', toggle: set('gl', !s.gl), trackBg: s.gl ? '#7f9657' : 'rgba(244,236,221,.2)', knobLeft: s.gl ? 21 : 3 },
    ];

    const verdict = guard ? 'Formule bloquée' : nTension ? 'Ta formule tranche' : 'Formule stable';
    return {
      bs: bs, bm: bm, bc: bc, bn: bn,
      anim: hasTension ? 'wob .5s ease-in-out infinite alternate' : 'none',
      liqOpacity: guard ? 0.45 : 1,
      glow: guard ? '#f08a7e' : hasTension ? '#e0b155' : '#c98ab0',
      hasSyn: hasSyn, hasTension: hasTension, guard: guard,
      verdict: verdict,
      verdictColor: guard ? '#f08a7e' : nTension ? '#e0b155' : '#a9ba7e',
      gauges: gauges,
      reactions: reactions,
      reacCount: R.length > 3 ? '3 sur ' + R.length : R.length + (R.length > 1 ? ' actives' : ' active'),
      levers: levers,
      ctaText: guard ? 'Corrige le garde-fou pour incuber' : 'Incuber 8 semaines',
      ctaBg: guard ? 'transparent' : '#dd6e40',
      ctaInk: guard ? '#c9b79a' : '#1c150e',
      ctaBorder: guard ? 'rgba(244,236,221,.24)' : '#dd6e40',
    };
  }
}
</script>
</body>
</html>
