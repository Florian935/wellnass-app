# Sync rules PowerSync — format `bucket_definitions` (standard, tous SDK).
# À coller dans le dashboard PowerSync (Settings → Sync Rules) puis « Deploy ».
# Réf. : docs/specs/technical/schema-donnees-muscu.md §3.2
#
# ⚠️ Format : on utilise `bucket_definitions` (et non `streams`/edition 3). Les Sync Streams
# `auto_subscribe` ne délivraient aucune donnée au client (SDK connecté mais 0 bucket) ; le
# format `bucket_definitions` est consommé nativement par @powersync/react-native sans
# souscription côté client. `request.user_id()` = id utilisateur extrait du JWT Supabase.
#
# Deux buckets :
#   user_data      — données propres à l'utilisateur (user_id) + contenu custom (owner_id = user).
#   shared_content — contenu de bibliothèque (owner_id NULL), lecture seule côté app.

bucket_definitions:
  user_data:
    parameters: select request.user_id() as user_id
    data:
      # ── Socle transverse ──────────────────────────────────────────────────
      - select * from profiles              where user_id = bucket.user_id and deleted_at is null
      - select * from user_settings         where user_id = bucket.user_id and deleted_at is null
      - select * from nutrition_profiles    where user_id = bucket.user_id and deleted_at is null
      # ── Musculation ───────────────────────────────────────────────────────
      - select * from exercises             where owner_id = bucket.user_id and deleted_at is null
      - select * from exercise_translations where owner_id = bucket.user_id and deleted_at is null
      - select * from exercise_favorites    where user_id = bucket.user_id and deleted_at is null
      - select * from exercise_notes        where user_id = bucket.user_id and deleted_at is null
      - select * from exercise_variants     where owner_id = bucket.user_id and deleted_at is null

      - select * from workouts              where user_id = bucket.user_id and deleted_at is null
      - select * from workout_sets          where user_id = bucket.user_id and deleted_at is null
      - select * from workout_superset_pairs where user_id = bucket.user_id and deleted_at is null
      - select * from workout_templates     where user_id = bucket.user_id and deleted_at is null
      - select * from workout_template_exercises where user_id = bucket.user_id and deleted_at is null
      - select * from programs              where owner_id = bucket.user_id and deleted_at is null
      - select * from program_translations  where owner_id = bucket.user_id and deleted_at is null
      - select * from sessions              where owner_id = bucket.user_id and deleted_at is null
      - select * from exercise_plans        where owner_id = bucket.user_id and deleted_at is null
      # US RUN-F2c : blocs fractionné/intervalles (une ligne = un bloc de répétitions).
      - select * from session_intervals     where owner_id = bucket.user_id and deleted_at is null
      - select * from personal_records      where user_id = bucket.user_id and deleted_at is null
      # ── Alimentation ──────────────────────────────────────────────────────
      - select * from foods                 where owner_id = bucket.user_id and deleted_at is null
      - select * from food_translations     where owner_id = bucket.user_id and deleted_at is null
      - select * from food_favorites        where user_id = bucket.user_id and deleted_at is null
      - select * from food_entries          where user_id = bucket.user_id and deleted_at is null
      - select * from recipes               where user_id = bucket.user_id and deleted_at is null
      - select * from recipe_ingredients    where user_id = bucket.user_id and deleted_at is null
      - select * from meal_templates        where user_id = bucket.user_id and deleted_at is null
      - select * from meal_template_items   where user_id = bucket.user_id and deleted_at is null
      - select * from body_weight_entries   where user_id = bucket.user_id and deleted_at is null
      # US PAS-01 : pas quotidiens lus dans Health Connect (une ligne par jour, synchronisée).
      - select * from daily_steps           where user_id = bucket.user_id and deleted_at is null
      # US BIEN-01 : check-in de bien-être (humeur / énergie / stress, une ligne par jour).
      - select * from daily_wellbeing       where user_id = bucket.user_id and deleted_at is null
      # US CYCLE-01 : suivi du cycle menstruel. Deux tables indépendantes (aucune FK entre elles) —
      # un jour de flux peut exister sans période déclarée. `ended_on` null = période en cours.
      # ⚠️ Donnée de santé SENSIBLE : elle ne quitte l'appareil que si l'utilisatrice a activé le
      # suivi (opt-in strict, `user_settings.cycle_tracking_enabled`, désactivé par défaut).
      - select * from menstrual_periods     where user_id = bucket.user_id and deleted_at is null
      - select * from menstrual_daily_logs  where user_id = bucket.user_id and deleted_at is null
      # US MESUR-01 : mensurations corporelles (modèle normalisé — une ligne par jour ET par mesure).
      - select * from body_measurements     where user_id = bucket.user_id and deleted_at is null
      # US STREAK-01 : jokers de série (une ligne par jour manqué couvert).
      - select * from streak_jokers         where user_id = bucket.user_id and deleted_at is null
      # US OBJ-01 : objectifs à échéance. Ni statut ni progression stockés — tout est dérivé de la
      # fenêtre [start_date, deadline] côté client, donc le calcul marche hors ligne.
      - select * from personal_goals        where user_id = bucket.user_id and deleted_at is null
      # US VIE-01 : périodes « vie réelle » (bornes incluses). Même patron dérivé qu'OBJ-01 : la ligne
      # ne porte que son intervalle. L'HISTORIQUE est répliqué volontairement — c'est lui qui permet
      # d'annoter les analyses passées (décision D2) ; une période échue n'a plus aucun effet actif.
      - select * from real_life_periods     where user_id = bucket.user_id and deleted_at is null
      # US REPAS-01 : planning repas (4.27) et liste de courses (4.28).
      # `meal_plan_entries` est une INTENTION, jamais du consommé : elle n'a aucun lien avec
      # `food_entries`, que seul un geste explicite de l'utilisateur alimente (règle R1).
      # `shopping_lists` n'a volontairement PAS de contrainte d'unicité par semaine (décision D6) :
      # deux appareils hors réseau peuvent générer la même semaine, et une violation d'unicité
      # bloquerait la file d'upload. La liste active est la plus récente par `generated_at`.
      - select * from meal_plan_entries     where user_id = bucket.user_id and deleted_at is null
      - select * from shopping_lists        where user_id = bucket.user_id and deleted_at is null
      - select * from shopping_list_items   where user_id = bucket.user_id and deleted_at is null
      # ── Running ───────────────────────────────────────────────────────────
      - select * from running_profiles      where user_id = bucket.user_id and deleted_at is null
      - select * from runs                  where user_id = bucket.user_id and deleted_at is null
      - select * from planned_sessions      where owner_id = bucket.user_id and deleted_at is null
      - select * from running_pace_records  where user_id = bucket.user_id and deleted_at is null
      # ── Analytics (US 9.10) ─────────────────────────────────────────────────
      # append-only : PAS de deleted_at (ne pas ajouter `and deleted_at is null`).
      - select * from analytics_events      where user_id = bucket.user_id

  shared_content:
    data:
      # Bibliothèque globale (owner_id NULL) — lecture seule côté app.
      # exercises : filtre status='published' (US 8.2) — les brouillons éditoriaux ne descendent jamais
      # au mobile (même pattern que `programs`). exercise_translations n'a PAS besoin de filtre status :
      # sans le parent (brouillon non synchronisé), ses traductions ne sont de toute façon pas exploitables.
      # ⚠️ US ADMIN-01 — PAS de filtre `deleted_at` sur ces deux tables, et c'est volontaire.
      # `workout_sets` ne porte que `exercise_id` : si un exercice archivé quitte la base locale,
      # l'historique des utilisateurs affiche un nom VIDE (spec ADMIN-01 §0). On réplique donc les
      # lignes archivées pour que le nom reste résoluble, et c'est **l'app** qui masque l'archivé
      # dans les listes de sélection (elle filtre déjà `e.deleted_at IS NULL` partout où il faut).
      # `status = 'published'` reste : un brouillon éditorial ne descend jamais au mobile.
      - select * from exercises             where owner_id is null and status = 'published'
      - select * from exercise_translations where owner_id is null
      - select * from exercise_variants     where owner_id is null and deleted_at is null
      - select * from programs              where owner_id is null and status = 'published' and deleted_at is null
      - select * from program_translations  where owner_id is null and deleted_at is null
      - select * from sessions              where owner_id is null and deleted_at is null
      - select * from exercise_plans        where owner_id is null and deleted_at is null
      - select * from session_intervals     where owner_id is null and deleted_at is null
      - select * from foods                 where owner_id is null and deleted_at is null
      - select * from food_translations     where owner_id is null and deleted_at is null
