# Sync rules PowerSync — Sync Streams (edition 3).
# Appliquées manuellement sur le tableau de bord PowerSync (Settings → Sync Rules) puis « Deploy ».
# Réf. : docs/specs/technical/schema-donnees-muscu.md §3.2 · https://docs.powersync.com/sync/streams/overview
#
# Migration de format : l'instance PowerSync est en **edition 3 (streams)**, pas en ancien
# `bucket_definitions`. Un stream = une requête ; `auth.user_id()` remplace `request.user_id()`.
# `auto_subscribe: true` → l'app synchronise automatiquement (offline-first, aucune souscription
# explicite côté client).
#
# Trois familles de streams :
#   * données utilisateur (user_id = auth.user_id())
#   * contenu custom de l'utilisateur (owner_id = auth.user_id())
#   * contenu de bibliothèque (owner_id IS NULL, lecture seule côté app)

config:
  edition: 3

streams:
  # ── Données utilisateur (user_id) ──────────────────────────────────────────
  profiles:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE user_id = auth.user_id() AND deleted_at IS NULL
  user_settings:
    auto_subscribe: true
    query: SELECT * FROM user_settings WHERE user_id = auth.user_id() AND deleted_at IS NULL
  nutrition_profiles:
    auto_subscribe: true
    query: SELECT * FROM nutrition_profiles WHERE user_id = auth.user_id() AND deleted_at IS NULL
  exercise_favorites:
    auto_subscribe: true
    query: SELECT * FROM exercise_favorites WHERE user_id = auth.user_id() AND deleted_at IS NULL
  workouts:
    auto_subscribe: true
    query: SELECT * FROM workouts WHERE user_id = auth.user_id() AND deleted_at IS NULL
  workout_sets:
    auto_subscribe: true
    query: SELECT * FROM workout_sets WHERE user_id = auth.user_id() AND deleted_at IS NULL
  personal_records:
    auto_subscribe: true
    query: SELECT * FROM personal_records WHERE user_id = auth.user_id() AND deleted_at IS NULL
  food_favorites:
    auto_subscribe: true
    query: SELECT * FROM food_favorites WHERE user_id = auth.user_id() AND deleted_at IS NULL
  food_entries:
    auto_subscribe: true
    query: SELECT * FROM food_entries WHERE user_id = auth.user_id() AND deleted_at IS NULL
  runs:
    auto_subscribe: true
    query: SELECT * FROM runs WHERE user_id = auth.user_id() AND deleted_at IS NULL

  # ── Contenu custom de l'utilisateur (owner_id = auth.user_id()) ─────────────
  exercises_custom:
    auto_subscribe: true
    query: SELECT * FROM exercises WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  exercise_translations_custom:
    auto_subscribe: true
    query: SELECT * FROM exercise_translations WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  programs_custom:
    auto_subscribe: true
    query: SELECT * FROM programs WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  program_translations_custom:
    auto_subscribe: true
    query: SELECT * FROM program_translations WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  sessions_custom:
    auto_subscribe: true
    query: SELECT * FROM sessions WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  exercise_plans_custom:
    auto_subscribe: true
    query: SELECT * FROM exercise_plans WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  foods_custom:
    auto_subscribe: true
    query: SELECT * FROM foods WHERE owner_id = auth.user_id() AND deleted_at IS NULL
  food_translations_custom:
    auto_subscribe: true
    query: SELECT * FROM food_translations WHERE owner_id = auth.user_id() AND deleted_at IS NULL

  # ── Contenu de bibliothèque (owner_id IS NULL, lecture seule) ───────────────
  exercises_library:
    auto_subscribe: true
    query: SELECT * FROM exercises WHERE owner_id IS NULL AND deleted_at IS NULL
  exercise_translations_library:
    auto_subscribe: true
    query: SELECT * FROM exercise_translations WHERE owner_id IS NULL AND deleted_at IS NULL
  programs_library:
    auto_subscribe: true
    query: SELECT * FROM programs WHERE owner_id IS NULL AND status = 'published' AND deleted_at IS NULL
  program_translations_library:
    auto_subscribe: true
    query: SELECT * FROM program_translations WHERE owner_id IS NULL AND deleted_at IS NULL
  sessions_library:
    auto_subscribe: true
    query: SELECT * FROM sessions WHERE owner_id IS NULL AND deleted_at IS NULL
  exercise_plans_library:
    auto_subscribe: true
    query: SELECT * FROM exercise_plans WHERE owner_id IS NULL AND deleted_at IS NULL
  foods_library:
    auto_subscribe: true
    query: SELECT * FROM foods WHERE owner_id IS NULL AND deleted_at IS NULL
  food_translations_library:
    auto_subscribe: true
    query: SELECT * FROM food_translations WHERE owner_id IS NULL AND deleted_at IS NULL
