name: CI

# Qualité sur chaque PR vers dev/main + sur les pushes de ces branches.
# Cible : typecheck + lint + tests unitaires < 10 min (bonnes-pratiques §10).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Couverture et non `npm run test` : c'est elle qui applique les seuils déclarés dans
      # `jest.config.js` (mobile, par chemin) et les `vitest.config.ts` (shared, admin). Sans ce
      # `--coverage`, les seuils sont du texte mort — `packages/shared` en déclarait à 100 %
      # depuis des mois sans les tenir, et rien ne l'a jamais signalé.
      #
      # Les seuils sont des cliquets posés sur le réel : une PR qui les fait rougir a **retiré**
      # de la couverture. La réponse est d'en ajouter, pas de baisser le seuil.
      - name: Tests + seuils de couverture
        run: npm run test:coverage
